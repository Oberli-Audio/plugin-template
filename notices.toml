# Third-party manifest: ship-bob notices.py generates THIRD_PARTY_NOTICES.md from this file and
# checks it against CMakeLists.txt (ship-bob references/notices.md). Never edit the generated
# file; a new dependency, font or Faust function is an entry here first. Two fonts are bundled
# with the shared code (Source/oberli/assets/fonts): Rubik and Nunito.

[check]
cmake = ["CMakeLists.txt"]
ignore = []

[[component]]
name = "JUCE"
kind = "framework"
version = "8.0.16"
spdx = "LicenseRef-JUCE-8-EULA"
copyright = "Raw Material Software Limited"
url = "https://juce.com"
note = "Built with JUCE under the JUCE 8 End User Licence Agreement, Starter tier, fetched by commit at build time with one local fix to its VST3 wrapper (a bounds check, cmake/PatchJuce.cmake), and not redistributed. JUCE's own copyright notices are retained in the binary; the SDKs and libraries inside JUCE are listed in its JUCE.spdx.json."

[[component]]
name = "VST 3 SDK"
kind = "sdk"
version = "3.8.0"
spdx = "MIT"
copyright = "Steinberg Media Technologies GmbH"
url = "https://github.com/steinbergmedia/vst3sdk"
license_file = "LICENSES/MIT.txt"
note = "The copy bundled inside JUCE 8.0.16. VST is a registered trademark of Steinberg Media Technologies GmbH."
cmake = "vst3sdk"

[[component]]
name = "Rubik"
kind = "font"
version = "2.300"
spdx = "OFL-1.1"
copyright = "2015 The Rubik Project Authors"
url = "https://github.com/googlefonts/rubik"
license_file = "LICENSES/OFL-1.1.txt"
files = ["Rubik-Regular.ttf", "Rubik-Medium.ttf", "Rubik-SemiBold.ttf", "Rubik-Bold.ttf", "Rubik-ExtraBold.ttf"]
note = "The editor's typeface (the Oberli Audio design system). The five static instances Google Fonts serves (Regular, Medium, SemiBold, Bold, ExtraBold), bundled unmodified in the plugin binary through BinaryData: no subsetting, no renaming."

[[component]]
name = "Nunito"
kind = "font"
version = "3.602"
spdx = "OFL-1.1"
copyright = "2014 The Nunito Project Authors"
url = "https://github.com/googlefonts/nunito"
license_file = "LICENSES/OFL-1.1.txt"
files = ["Nunito-Regular.ttf", "Nunito-SemiBold.ttf"]
note = "The editor's face for running text (the About text, tooltips, preset descriptions, messages). The two static instances Google Fonts serves (Regular, SemiBold), bundled unmodified in the plugin binary through BinaryData: no subsetting, no renaming."
